meters:
- name: api_requests
  description: REST API calls made against the per-key rate limit (no monetary charge on the free non-commercial key).
  unit: requests
  aggregation: sum
  dimensions:
  - api_key
  - endpoint
- name: daily_quota_consumption
  description: Share of the daily request quota consumed by an API key.
  unit: requests
  aggregation: sum
  dimensions:
  - api_key
principles:
- name: Visibility
  description: Track requests-per-second and daily request counts per API key against the key's rate limit to see how close you are to throttling.
- name: Allocation
  description: Use separate API keys per application or workload so quota consumption maps to the right owner.
- name: Optimization
  description: Cache slow-changing setlist, artist, and venue data client-side and batch discovery through search to minimize calls and stay under the daily quota.
- name: Accountability
  description: Assign an owner per API key; if a project needs commercial use or higher volume, escalate to a licensing/upgrade request with setlist.fm rather than exceeding terms.
