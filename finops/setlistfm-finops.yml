description: >-
  FinOps view of setlist.fm API spend. The setlist.fm REST API carries no usage
  fee: it is free for non-commercial use behind a free API key, so there is no
  vendor invoice to manage. The real "cost" is operational - staying within the
  per-key rate limits (commonly 2 req/sec and 1,440 requests/day) so an
  application is not throttled with HTTP 429, and caching responses to reduce
  call volume. Commercial use is not covered by the free key and would move
  spend into a negotiated licensing agreement arranged directly with setlist.fm
  (owned by Live Nation Entertainment / Ticketmaster).
notes: >-
  No metered billing exists for the free non-commercial key; the constraint is
  the request quota, not dollars. Any commercial licensing cost is negotiated
  off-list. Verify terms on the setlist.fm docs and terms pages.
