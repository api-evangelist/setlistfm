name: setlist.fm
kind: company
description: setlist.fm is the world's largest crowd-sourced concert setlist database
  and community, letting fans document, share, and explore which songs artists play
  at live shows. The setlist.fm REST API gives read-only access to that data - artists
  (keyed by MusicBrainz MBID), setlists and their revision history, venues, cities,
  and countries, plus full-text search across each - so developers can build music
  apps, tour trackers, and research tools. setlist.fm is owned by Live Nation
  Entertainment through its Ticketmaster subsidiary. The API is free for
  non-commercial use with an API key; commercial use requires contacting setlist.fm.
